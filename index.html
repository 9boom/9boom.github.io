<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --cell: #0a0d10;
    --cell-hover: #10151a;
    --line: #1d242b;
    --text: #e6edf3;
    --muted: #6b7680;
    --sky: #38bdf8;
    --sky-dim: rgba(56, 189, 248, 0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }

  html, body { background: var(--bg); }

  body {
    min-height: 100vh;
    padding: clamp(14px, 2vw, 28px);
    font-family: "JetBrains Mono", "IBM Plex Sans Thai", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: none; margin: 0 auto; position: relative; z-index: 1; }

  /* ---------- gravitational grid background ---------- */
  #bgCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
    display: block;
    background: transparent;
  }

  /* ---------- header ---------- */
  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: clamp(32px, 6vw, 72px);
  }

  .brand { min-width: 0; }

  .line {
    display: flex;
    align-items: center;
    min-height: 1.4em;
    line-height: 1.4;
  }
  .line.name {
    font-size: clamp(28px, 5.2vw, 60px);
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .line.sub {
    margin-top: 6px;
    font-size: clamp(16px, 2.2vw, 26px);
    color: var(--muted);
  }

  .cursor {
    display: none;
    width: 0.5em;
    height: 0.95em;
    margin-left: 6px;
    background: var(--sky);
    animation: blink 1s steps(1) infinite;
  }
  .cursor.on { display: inline-block; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- language toggle ---------- */
  .lang {
    display: flex;
    flex-shrink: 0;
    border: 1px solid var(--line);
  }
  .lang button {
    padding: 12px 22px;
    background: var(--cell);
    color: var(--muted);
    border: 0;
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 120ms linear, color 120ms linear;
  }
  .lang button + button { border-left: 1px solid var(--line); }
  .lang button:hover { color: var(--text); background: var(--cell-hover); }
  .lang button[aria-pressed="true"] { background: var(--sky); color: #000; }
  .lang button:focus-visible {
    outline: 1px solid var(--sky);
    outline-offset: -3px;
  }
  .lang button[aria-pressed="true"]:focus-visible { outline-color: #000; }

  /* ---------- grid: บล็อกจัตุรัส กว้าง = สูง ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;                       /* เส้นคั่นระหว่างบล็อก */
    background: var(--line);
    border: 1px solid var(--line);
  }

  .item {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 10px;
    aspect-ratio: 1 / 1;
    min-width: 0;
    padding: clamp(18px, 2vw, 28px);
    background: var(--cell);
    color: var(--text);
    border: 0;
    font: inherit;
    text-align: left;
    cursor: pointer;
    overflow: hidden;
    transition: background-color 120ms linear, color 120ms linear;
  }

  .item .n {
    font-size: clamp(20px, 2.2vw, 30px);
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }
  .item .d {
    font-size: clamp(13px, 1.1vw, 15px);
    font-weight: 400;
    line-height: 1.5;
    color: var(--muted);
    transition: color 120ms linear;
  }

  .item::before {                    /* prompt marker */
    content: ">";
    position: absolute;
    top: clamp(16px, 1.8vw, 24px);
    left: clamp(18px, 2vw, 28px);
    font-size: 18px;
    color: var(--muted);
    transition: color 120ms linear;
  }

  .item:hover { background: var(--cell-hover); }
  .item:hover::before { color: var(--sky); }

  .item:focus-visible {
    outline: 1px solid var(--sky);
    outline-offset: -1px;
    z-index: 1;
  }

  .item[aria-pressed="true"] {
    background: var(--sky-dim);
    color: var(--sky);
    box-shadow: inset 0 0 0 1px var(--sky);
    z-index: 1;
  }
  .item[aria-pressed="true"]::before { color: var(--sky); }
  .item[aria-pressed="true"] .d { color: var(--sky); opacity: 0.7; }

  .item[aria-pressed="true"] .n::after {
    content: "";
    display: inline-block;
    width: 0.5em;
    height: 0.95em;
    margin-left: 8px;
    vertical-align: -0.1em;
    background: var(--sky);
    animation: blink 1s steps(1) infinite;
  }

  /* ---------- รายละเอียดโปรเจคที่เลือก (แสดงแค่หัวข้อ) ---------- */
  .grid.is-hidden { display: none; }

  .details {
    padding: clamp(16px, 2vw, 22px) clamp(18px, 2vw, 28px);
    border: 1px solid var(--line);
    background: var(--cell);
  }
  .details-header {
    display: flex;
    align-items: center;
    font-size: clamp(18px, 2.2vw, 26px);
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--sky);
  }
  .details-prompt {
    margin-right: 10px;
    color: var(--sky);
  }
  .details-header .cursor { background: var(--sky); }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: clamp(16px, 2.5vw, 24px);
    padding: 10px 16px;
    background: var(--cell);
    color: var(--muted);
    border: 1px solid var(--line);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 120ms linear, color 120ms linear, border-color 120ms linear;
  }
  .back-btn:hover { color: var(--sky); border-color: var(--sky); background: var(--cell-hover); }
  .back-btn:focus-visible { outline: 1px solid var(--sky); outline-offset: -3px; }

  /* ---------- วิดีโอประกอบโปรเจค ---------- */
  .details-videos {
    margin-top: clamp(20px, 3vw, 32px);
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: clamp(12px, 2vw, 20px);
  }
  .details-videos.is-empty { display: none; }

  /* ---------- APWS diagrams ---------- */
  .apws-diagrams {
    margin-top: clamp(24px, 3vw, 36px);
  }

  .apws-diagrams.is-hidden {
    display: none;
  }

  .apws-diagram-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(16px, 2.5vw, 28px);
  }

  .apws-diagram {
    min-width: 0;
    margin: 0;
    padding: clamp(14px, 2vw, 20px);
    background: var(--cell);
    border: 1px solid var(--line);
  }

  .apws-diagram img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: auto;
    object-fit: contain;
    background: #000;
    border: 1px solid var(--line);
  }

  .apws-diagram-title {
    margin: 14px 0 8px;
    color: var(--text);
    font-size: clamp(16px, 1.5vw, 20px);
    line-height: 1.35;
    font-weight: 600;
  }

  .apws-diagram-description {
    margin: 0;
    color: var(--muted);
    font-size: clamp(13px, 1.1vw, 15px);
    line-height: 1.7;
  }

  @media (max-width: 720px) {
    .details-videos { grid-template-columns: 1fr; }

    .apws-diagram-grid {
      grid-template-columns: 1fr;
    }
  }

  .video-frame {
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: #000;
  }
  .video-frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  @media (max-width: 720px) {
    .details-videos { grid-template-columns: 1fr; }
  }

  /* ---------- gallery รูประหว่างทำชิ้นงาน ---------- */
  .wip-gallery { margin-top: clamp(20px, 3vw, 32px); }
  .wip-gallery.is-empty { display: none; }

  .wip-gallery-title {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .wip-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
  }
  @media (max-width: 900px) { .wip-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 480px) { .wip-grid { grid-template-columns: repeat(3, 1fr); } }

  .wip-thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--cell);
    padding: 0;
    cursor: pointer;
    transition: border-color 120ms linear;
  }
  .wip-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(0.85) contrast(1.02);
    transition: transform 200ms linear, filter 150ms linear;
  }
  .wip-thumb:hover { border-color: var(--sky); }
  .wip-thumb:hover img { transform: scale(1.08); filter: none; }
  .wip-thumb:focus-visible {
    outline: 1px solid var(--sky);
    outline-offset: -3px;
  }

  /* ---------- hologram viewer ---------- */
  .wip-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 6vw, 64px);
    background: radial-gradient(circle at 50% 45%, rgba(56, 189, 248, 0.10), rgba(0, 0, 0, 0.88) 70%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms linear;
  }
  .wip-overlay.is-open { opacity: 1; pointer-events: auto; }

  .wip-overlay-close {
    position: absolute;
    top: clamp(14px, 3vw, 28px);
    right: clamp(14px, 3vw, 28px);
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cell);
    color: var(--muted);
    border: 1px solid var(--line);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    transition: color 120ms linear, border-color 120ms linear;
  }
  .wip-overlay-close:hover { color: var(--sky); border-color: var(--sky); }
  .wip-overlay-close:focus-visible { outline: 1px solid var(--sky); outline-offset: -3px; }

  .wip-overlay-figure {
    position: relative;
    max-width: min(90vw, 920px);
    max-height: 84vh;
    transform: translateY(90px) scale(0.4);
    opacity: 0;
    transform-origin: 50% 100%;
    transition: transform 480ms cubic-bezier(0.2, 1.6, 0.3, 1), opacity 220ms ease-out;
  }
  .wip-overlay.is-open .wip-overlay-figure {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .wip-overlay-figure::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(56, 189, 248, 0.07) 0px,
      rgba(56, 189, 248, 0.07) 1px,
      transparent 2px,
      transparent 4px
    );
    mix-blend-mode: screen;
    pointer-events: none;
  }

  .wip-overlay-img {
    display: block;
    max-width: 100%;
    max-height: 84vh;
    width: auto;
    height: auto;
    background: #000;
    border: 1px solid rgba(56, 189, 248, 0.55);
    box-shadow:
      0 0 0 1px rgba(56, 189, 248, 0.25),
      0 0 40px rgba(56, 189, 248, 0.35),
      0 0 110px rgba(56, 189, 248, 0.20);
  }

  @media (prefers-reduced-motion: reduce) {
    .wip-overlay-figure { transition: none; }
  }

  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) {
    .top { gap: 12px; }
    .lang button { padding: 10px 14px; font-size: 13px; }
    .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .item, .item::before, .item .d, .lang button { transition: none; }
    .cursor, .item[aria-pressed="true"] .n::after { animation: none; }
  }
</style>
</head>
<body>

<canvas id="bgCanvas" aria-hidden="true"></canvas>

<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="line name"><span id="nameText"></span><span class="cursor" id="cursorName"></span></div>
      <div class="line sub"><span id="subText"></span><span class="cursor" id="cursorSub"></span></div>
    </div>

    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="th" aria-pressed="true">TH</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="grid" id="portfolioGrid" role="group"></div>

  <section class="details" id="details" hidden aria-live="polite">
    <button type="button" class="back-btn" id="backBtn"><span aria-hidden="true">&larr;</span><span id="backText"></span></button>
    <h2 class="details-header"><span class="details-prompt">&gt;</span><span id="detailsName"></span><span class="cursor on" id="cursorDetails"></span></h2>
    <div class="details-videos is-empty" id="detailsVideos"></div>

    <section class="apws-diagrams is-hidden" id="apwsDiagrams" aria-label="APWS system diagrams">
      <div class="apws-diagram-grid">
        <figure class="apws-diagram">
          <img
            src="assets/apws/watering_logic.png"
            alt="Watering Logic diagram"
            loading="lazy"
          >
          <figcaption>
            <h3 class="apws-diagram-title">Watering Logic</h3>
            <p class="apws-diagram-description">
              แผนภาพแสดงลำดับการทำงานของระบบรดน้ำอัตโนมัติ
              ตั้งแต่การตรวจสอบเงื่อนไขและข้อมูลจากระบบ
              ไปจนถึงการตัดสินใจสั่งงานระบบรดน้ำ
            </p>
          </figcaption>
        </figure>

        <figure class="apws-diagram">
          <img
            src="assets/apws/การแสกน.png"
            alt="Scanning diagram"
            loading="lazy"
          >
          <figcaption>
            <h3 class="apws-diagram-title">การสแกน</h3>
            <p class="apws-diagram-description">
              แผนภาพอธิบายกระบวนการสแกนและตรวจสอบข้อมูล
              เพื่อให้ระบบสามารถนำข้อมูลที่ได้ไปใช้ในการทำงาน
              และตัดสินใจตามเงื่อนไขที่กำหนด
            </p>
          </figcaption>
        </figure>
      </div>
    </section>

    <div class="wip-gallery is-empty" id="detailsGallery">
      <div class="wip-gallery-title" id="galleryTitle"></div>
      <div class="wip-grid" id="galleryGrid"></div>
    </div>
  </section>

</div>

<div class="wip-overlay" id="wipOverlay">
  <button type="button" class="wip-overlay-close" id="wipOverlayClose" aria-label="Close">&times;</button>
  <figure class="wip-overlay-figure">
    <img class="wip-overlay-img" id="wipOverlayImg" src="" alt="">
  </figure>
</div>

<script>
  /* ---------- ข้อความ 2 ภาษา (แก้ชื่อโปรเจคได้ตรงนี้) ---------- */
  const TEXT = {
    th: { name: "พงศกร ศรีวิชัย",       sub: "พอร์ตโฟลิโอ", group: "ผลงาน", back: "กลับ", galleryTitle: "รูประหว่างทำชิ้นงาน" },
    en: { name: "Pongsakorn Sriwichai", sub: "Portfolio",    group: "Works",  back: "Back", galleryTitle: "Work-in-progress photos" }
  };

  // name = ชื่อหลัก (ไม่เปลี่ยนตามภาษา) / th, en = ชื่อรองที่เปลี่ยนตามภาษา
  // slug = รหัสย่อ ใช้กับ URL แบบ ?redirect=<slug> เพื่อเข้าถึงโปรเจคนี้ได้ทันที
  const PROJECTS = [
    { id: "zemio",                  name: "Zemio",                          slug: "zemio",
      th: "เว็บฝึกสัมภาษณ์เข้ามหาวิทยาลัยด้วย AI",   en: "AI university interview practice" },
    { id: "laan-social",            name: "laan.social",                    slug: "laan",
      th: "ลาน ดอท โซเชียล",                          en: "Social platform for Thai university students" },
    { id: "schoolpay",              name: "SchoolPay",                      slug: "pay",
      th: "เว็บแอปทุนอาหารกลางวัน",                   en: "School lunch fund web app" },
    { id: "godot-android-exporter", name: "Godot Android Exporter",         slug: "godot",
      th: "เครื่องมือ CLI แปลงโปรเจค Godot เป็น APK",  en: "CLI tool to export Godot projects to APK" },
    { id: "promptchuay",            name: "PromptChuay",                    slug: "prompt",
      th: "แอปพลิเคชันรายงานผู้ประสบภัย",              en: "Disaster victim reporting app" },
    { id: "apws",                   name: "Automatic Plant Watering System", slug: "apws",
      th: "เครื่องรดน้ำต้นไม้อัตโนมัติ",                en: "Automatic plant watering machine",
      videos: ["2DMocGT5Phk", "Co5e_ErMyEI", "gLaoYPyxkNU", "_Orv_Qmnsk0"],
      gallery: "assets/apws/" },
    { id: "rem-glasses",            name: "REM-Glasses",                    slug: "rem",
      th: "แว่นตาช่วยกระตุ้นฝันรู้ตัวขณะหลับ",          en: "Glasses that trigger lucid dreams" }
  ];

  const grid       = document.getElementById("portfolioGrid");
  const nameEl     = document.getElementById("nameText");
  const subEl      = document.getElementById("subText");
  const cursorName = document.getElementById("cursorName");
  const cursorSub  = document.getElementById("cursorSub");
  const langBtns   = document.querySelectorAll(".lang button");
  const detailsEl     = document.getElementById("details");
  const detailsNameEl = document.getElementById("detailsName");
  const detailsVideosEl = document.getElementById("detailsVideos");
  const apwsDiagramsEl = document.getElementById("apwsDiagrams");
  const galleryEl      = document.getElementById("detailsGallery");
  const galleryTitleEl = document.getElementById("galleryTitle");
  const galleryGridEl  = document.getElementById("galleryGrid");
  const wipOverlay      = document.getElementById("wipOverlay");
  const wipOverlayImg   = document.getElementById("wipOverlayImg");
  const wipOverlayClose = document.getElementById("wipOverlayClose");
  const backBtn        = document.getElementById("backBtn");
  const backTextEl     = document.getElementById("backText");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- สร้างบล็อก ---------- */
  PROJECTS.forEach((p) => {
    const btn = document.createElement("button");
    btn.className = "item";
    btn.type = "button";
    btn.dataset.id = p.id;
    btn.setAttribute("aria-pressed", "false");
    btn.innerHTML = '<span class="n"></span><span class="d"></span>';
    btn.querySelector(".n").textContent = p.name;
    grid.appendChild(btn);
  });
  const items = grid.querySelectorAll(".item");

  /* ---------- animation พิมพ์ชื่อ ---------- */
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const segmenter = window.Intl && Intl.Segmenter
    ? new Intl.Segmenter(undefined, { granularity: "grapheme" })
    : null;
  const chars = (str) => segmenter
    ? Array.from(segmenter.segment(str), (s) => s.segment)
    : [...str];

  let runId = 0;
  function showCursor(which) {
    cursorName.classList.toggle("on", which === "name");
    cursorSub.classList.toggle("on", which === "sub");
  }

  async function playHeader(lang, firstLoad) {
    const id = ++runId;
    const { name, sub } = TEXT[lang];

    if (reduceMotion) {
      nameEl.textContent = name;
      subEl.textContent = sub;
      showCursor("sub");
      return;
    }

    nameEl.textContent = "";
    subEl.textContent = "";
    showCursor("name");
    await sleep(firstLoad ? 500 : 120);

    for (const ch of chars(name)) {
      if (id !== runId) return;
      nameEl.textContent += ch;
      await sleep(60);
    }

    if (id !== runId) return;
    await sleep(240);
    showCursor("sub");

    for (const ch of chars(sub)) {
      if (id !== runId) return;
      subEl.textContent += ch;
      await sleep(50);
    }
  }

  /* ---------- สลับภาษา ---------- */
  function applyLang(lang, firstLoad) {
    document.documentElement.lang = lang;
    grid.setAttribute("aria-label", TEXT[lang].group);

    items.forEach((el, i) => {
      el.querySelector(".d").textContent = PROJECTS[i][lang];
    });
    langBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    backTextEl.textContent = TEXT[lang].back;
    galleryTitleEl.textContent = TEXT[lang].galleryTitle;

    try { localStorage.setItem("portfolio-lang", lang); } catch (e) {}

    playHeader(lang, firstLoad);
  }

  langBtns.forEach((b) => b.addEventListener("click", () => {
    if (b.getAttribute("aria-pressed") === "true") return;
    applyLang(b.dataset.lang, false);
  }));

  /* ---------- gallery: อ่านไฟล์รูปทั้งหมดในโฟลเดอร์ assets ---------- */
  const IMAGE_EXT_RE = /\.(png|jpe?g|webp|gif|avif)$/i;
  const galleryCache = {};

  function imageExists(src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = src;
    });
  }

  // 1) ลองอ่าน assets/<folder>/manifest.json ก่อน (วิธีที่แนะนำ เสถียรบนทุกโฮสต์)
  // 2) ถ้าไม่มี manifest ลอง parse directory listing ของเซิร์ฟเวอร์ (ใช้ได้เมื่อเปิด autoindex)
  // 3) ถ้ายังไม่เจอ ลอง "เดา" ชื่อไฟล์เลขลำดับ 01-12 ทีละนามสกุลที่พบบ่อย
  async function listFolderImages(folder) {
    if (galleryCache[folder]) return galleryCache[folder];
    let files = [];

    try {
      const res = await fetch(folder + "manifest.json", { cache: "no-store" });
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data)) files = data.filter((f) => IMAGE_EXT_RE.test(f));
      }
    } catch (e) {}

    if (!files.length) {
      try {
        const res = await fetch(folder, { cache: "no-store" });
        if (res.ok) {
          const html = await res.text();
          const doc = new DOMParser().parseFromString(html, "text/html");
          files = Array.from(doc.querySelectorAll("a"))
            .map((a) => a.getAttribute("href") || "")
            .filter((href) => IMAGE_EXT_RE.test(href))
            .map((href) => href.split("/").pop());
        }
      } catch (e) {}
    }

    if (!files.length) {
      const exts = ["jpg", "jpeg", "png", "webp"];
      const guesses = [];
      for (let i = 1; i <= 12; i++) {
        const n = String(i).padStart(2, "0");
        exts.forEach((ext) => guesses.push(`${n}.${ext}`));
      }
      const checked = await Promise.all(
        guesses.map(async (name) => ((await imageExists(folder + name)) ? name : null))
      );
      files = checked.filter(Boolean);
    }

    files = [...new Set(files)].slice(0, 12);
    galleryCache[folder] = files;
    return files;
  }

  async function renderGallery(folder) {
    galleryGridEl.innerHTML = "";
    if (!folder) {
      galleryEl.classList.add("is-empty");
      return;
    }

    const files = await listFolderImages(folder);
    if (!files.length) {
      galleryEl.classList.add("is-empty");
      return;
    }

    files.forEach((file) => {
      const src = folder + file;
      const thumb = document.createElement("button");
      thumb.type = "button";
      thumb.className = "wip-thumb";
      const img = document.createElement("img");
      img.src = src;
      img.loading = "lazy";
      img.alt = "";
      thumb.appendChild(img);
      thumb.addEventListener("click", () => openHologram(src));
      galleryGridEl.appendChild(thumb);
    });

    galleryEl.classList.remove("is-empty");
  }

  /* ---------- hologram viewer: เปิดรูปเต็มลอยขึ้นมากลางจอ ---------- */
  let lastFocused = null;

  function openHologram(src) {
    lastFocused = document.activeElement;
    wipOverlayImg.src = src;
    wipOverlay.classList.add("is-open");
    wipOverlayClose.focus();
    document.body.style.overflow = "hidden";
  }

  function closeHologram() {
    wipOverlay.classList.remove("is-open");
    document.body.style.overflow = "";
    if (lastFocused) lastFocused.focus();
    setTimeout(() => { wipOverlayImg.src = ""; }, 200);
  }

  wipOverlayClose.addEventListener("click", closeHologram);
  wipOverlay.addEventListener("click", (e) => {
    if (e.target === wipOverlay) closeHologram();
  });
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && wipOverlay.classList.contains("is-open")) closeHologram();
  });

  /* ---------- ซิงค์ ?redirect=<slug> กับ URL ---------- */
  function setUrlParam(slug) {
    const url = new URL(window.location.href);
    url.searchParams.set("redirect", slug);
    history.replaceState(null, "", url);
  }
  function clearUrlParam() {
    const url = new URL(window.location.href);
    url.searchParams.delete("redirect");
    history.replaceState(null, "", url);
  }

  /* ---------- เลือกผลงาน ---------- */
  // เลือกได้ทีละ 1 อัน / กดซ้ำเพื่อยกเลิก
  // อยากให้เลือกได้หลายอัน: ลบบรรทัด "items.forEach(...)" ในนี้ออก
  function showGrid() {
    items.forEach((el) => el.setAttribute("aria-pressed", "false"));
    grid.classList.remove("is-hidden");
    detailsEl.hidden = true;
    detailsNameEl.textContent = "";
    detailsVideosEl.innerHTML = "";
    detailsVideosEl.classList.add("is-empty");
    apwsDiagramsEl.classList.add("is-hidden");
    galleryGridEl.innerHTML = "";
    galleryEl.classList.add("is-empty");
    clearUrlParam();
    window.dispatchEvent(new CustomEvent("portfolio:select", { detail: null }));
  }

  function renderApwsDiagrams(project) {
    if (!apwsDiagramsEl) return;

    if (project && project.id === "apws") {
      apwsDiagramsEl.classList.remove("is-hidden");
    } else {
      apwsDiagramsEl.classList.add("is-hidden");
    }
  }

  function renderVideos(videos) {
    detailsVideosEl.innerHTML = "";
    if (!videos || !videos.length) {
      detailsVideosEl.classList.add("is-empty");
      return;
    }
    videos.forEach((videoId) => {
      const frame = document.createElement("div");
      frame.className = "video-frame";
      const iframe = document.createElement("iframe");
      iframe.src = `https://www.youtube.com/embed/${videoId}`;
      iframe.title = "YouTube video player";
      iframe.loading = "lazy";
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      iframe.allowFullscreen = true;
      frame.appendChild(iframe);
      detailsVideosEl.appendChild(frame);
    });
    detailsVideosEl.classList.remove("is-empty");
  }

  function showDetails(btn) {
    const lang = document.documentElement.lang;
    const p = PROJECTS.find((x) => x.id === btn.dataset.id);

    items.forEach((el) => el.setAttribute("aria-pressed", "false"));
    btn.setAttribute("aria-pressed", "true");

    grid.classList.add("is-hidden");
    detailsNameEl.textContent = p.name;
    detailsEl.hidden = false;
    renderVideos(p.videos);
    renderApwsDiagrams(p);
    renderGallery(p.gallery);
    setUrlParam(p.slug);

    window.dispatchEvent(new CustomEvent("portfolio:select", {
      detail: { id: p.id, name: p.name, desc: p[lang], lang }
    }));
  }

  grid.addEventListener("click", (e) => {
    const btn = e.target.closest(".item");
    if (!btn) return;
    showDetails(btn);
  });

  backBtn.addEventListener("click", showGrid);

  /* ---------- เริ่มต้น ---------- */
  let startLang = "th";
  try {
    const saved = localStorage.getItem("portfolio-lang");
    if (saved === "th" || saved === "en") startLang = saved;
  } catch (e) {}
  applyLang(startLang, true);

  // ?redirect=<slug> → เปิดหน้ารายละเอียดโปรเจคนั้นทันทีตอนโหลดหน้า
  (function handleRedirectParam() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("redirect");
    if (!slug) return;
    const project = PROJECTS.find((p) => p.slug === slug || p.id === slug);
    if (!project) return;
    const btn = grid.querySelector(`.item[data-id="${project.id}"]`);
    if (btn) showDetails(btn);
  })();

  // ตัวอย่างการรับค่า:
  // window.addEventListener("portfolio:select", (e) => console.log(e.detail));
</script>

<script>
/* ============================================================
   Gravitational grid background — mouse ≈ มวล, ดัดตารางตามแรงโน้มถ่วง
   ============================================================ */
(function () {
  const canvas = document.getElementById("bgCanvas");
  if (!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const rootStyles = getComputedStyle(document.documentElement);
  function hexToRgb(hex) {
    const h = hex.trim().replace("#", "");
    const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
    const n = parseInt(full, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const skyRgb = hexToRgb(rootStyles.getPropertyValue("--sky") || "#38bdf8");

  let W = 0, H = 0, DPR = 1;
  const COLS = 28, ROWS = 18;
  let planeW = 0, planeH = 0, points = [];

  function buildGrid() {
    planeW = W * 1.6;
    planeH = H * 1.6;
    points = [];
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      for (let c = 0; c < COLS; c++) {
        row.push({
          x: -planeW / 2 + c * (planeW / (COLS - 1)),
          y: -planeH / 2 + r * (planeH / (ROWS - 1))
        });
      }
      points.push(row);
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildGrid();
  }

  // ตำแหน่งเมาส์จริง (พิกเซล, ไม่หน่วง)
  let rawPxX = 0, rawPxY = 0, hasMouse = false;

  // ตำแหน่ง "วงกลมฟ้า" ที่หน่วงตามเมาส์ (พิกเซล) — ค่า LAG ยิ่งน้อย ยิ่งตามไม่ทัน
  const LAG = 0.055;
  let circlePxX = 0, circlePxY = 0, circleInit = false;

  function setRaw(clientX, clientY) {
    rawPxX = clientX;
    rawPxY = clientY;
    if (!circleInit) { circlePxX = clientX; circlePxY = clientY; circleInit = true; }
    hasMouse = true;
  }
  window.addEventListener("pointermove", (e) => setRaw(e.clientX, e.clientY), { passive: true });
  window.addEventListener("pointerdown", (e) => setRaw(e.clientX, e.clientY), { passive: true });
  window.addEventListener("pointerleave", () => { hasMouse = false; });
  window.addEventListener("blur", () => { hasMouse = false; });

  function drawCircle(px, py, strength) {
    const baseR = 26;
    const r = baseR + strength * 10;
    const [cr, cg, cb] = skyRgb;

    // แกนกลางสว่าง
    const core = ctx.createRadialGradient(px, py, 0, px, py, r);
    core.addColorStop(0, `rgba(${cr}, ${cg}, ${cb}, 0.55)`);
    core.addColorStop(0.55, `rgba(${cr}, ${cg}, ${cb}, 0.16)`);
    core.addColorStop(1, `rgba(${cr}, ${cg}, ${cb}, 0)`);
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();

    // ขอบวงแหวนฟ้าบาง ๆ
    ctx.strokeStyle = `rgba(${cr}, ${cg}, ${cb}, 0.85)`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(px, py, baseR * 0.42, 0, Math.PI * 2);
    ctx.stroke();

    // แสงฟุ้งรัศมีกว้าง (ให้ความรู้สึกสนามโน้มถ่วง)
    const halo = ctx.createRadialGradient(px, py, r * 0.6, px, py, r * 3.2);
    halo.addColorStop(0, `rgba(${cr}, ${cg}, ${cb}, 0.10)`);
    halo.addColorStop(1, `rgba(${cr}, ${cg}, ${cb}, 0)`);
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(px, py, r * 3.2, 0, Math.PI * 2);
    ctx.fill();
  }

  const CAM_Z = 950;
  function project(x, y, z, rotX, rotY) {
    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    const x1 = x * cosY - z * sinY;
    const z1 = x * sinY + z * cosY;
    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
    const y1 = y * cosX - z1 * sinX;
    const z2 = y * sinX + z1 * cosX;
    const scale = CAM_Z / (CAM_Z + z2);
    return { sx: W / 2 + x1 * scale, sy: H / 2 + y1 * scale * 0.9 };
  }

  function drawSeg(a, b, strength) {
    const [r, g, bl] = skyRgb;
    const glow = Math.min(1, strength);
    if (glow > 0.03) {
      ctx.strokeStyle = `rgba(${r}, ${g}, ${bl}, ${(0.12 + glow * 0.75).toFixed(3)})`;
      ctx.lineWidth = 1 + glow * 0.6;
    } else {
      ctx.strokeStyle = "rgba(88, 98, 108, 0.14)";
      ctx.lineWidth = 1;
    }
    ctx.beginPath();
    ctx.moveTo(a.sx, a.sy);
    ctx.lineTo(b.sx, b.sy);
    ctx.stroke();
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);

    // วงกลมฟ้าไล่ตามเมาส์แบบหน่วง ๆ (easing ช้ากว่าเมาส์จริง)
    circlePxX += (rawPxX - circlePxX) * LAG;
    circlePxY += (rawPxY - circlePxY) * LAG;

    // ระยะห่างระหว่างวงกลมกับเมาส์จริง ใช้ปรับความสว่าง/ขนาดตอนเคลื่อนไหวเร็ว
    const lagDx = rawPxX - circlePxX, lagDy = rawPxY - circlePxY;
    const lagStrength = Math.min(1, Math.sqrt(lagDx * lagDx + lagDy * lagDy) / 140);

    // normalized -1..1 จากตำแหน่ง "วงกลม" (ไม่ใช่เมาส์จริง) — ให้แรงโน้มถ่วงตามวงกลม
    const cnX = (circlePxX / W) * 2 - 1;
    const cnY = (circlePxY / H) * 2 - 1;

    const rotY = cnX * 0.22;
    const rotX = -cnY * 0.16;

    const massX = cnX * (planeW / 2) * 0.85;
    const massY = cnY * (planeH / 2) * 0.85;
    const R = Math.min(planeW, planeH) * 0.3;
    const maxDip = 190;   // ความลึกของหลุมโน้มถ่วง
    const pull = 0.6;     // แรงดึงตารางเข้าหามวล

    const grid = [];
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      for (let c = 0; c < COLS; c++) {
        const p = points[r][c];
        let px = p.x, py = p.y, pz = 0, strength = 0;

        if (hasMouse) {
          const dx = massX - px;
          const dy = massY - py;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const t = Math.max(0, 1 - dist / R);
          strength = t * t * (3 - 2 * t); // smoothstep falloff
          pz = strength * maxDip;         // ยุบตัวเข้าไปเหมือนหลุมโน้มถ่วง
          px += dx * strength * pull;     // ตารางถูกดึงโค้งเข้าหามวล
          py += dy * strength * pull;
        }

        const proj = project(px, py, pz, rotX, rotY);
        proj.strength = strength;
        row.push(proj);
      }
      grid.push(row);
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const a = grid[r][c];
        if (c < COLS - 1) {
          const b = grid[r][c + 1];
          drawSeg(a, b, (a.strength + b.strength) / 2);
        }
        if (r < ROWS - 1) {
          const b2 = grid[r + 1][c];
          drawSeg(a, b2, (a.strength + b2.strength) / 2);
        }
      }
    }

    if (hasMouse) drawCircle(circlePxX, circlePxY, lagStrength);

    requestAnimationFrame(frame);
  }

  function staticFrame() {
    ctx.clearRect(0, 0, W, H);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const p = points[r][c];
        const a = project(p.x, p.y, 0, 0, 0);
        if (c < COLS - 1) drawSeg(a, project(points[r][c + 1].x, points[r][c + 1].y, 0, 0, 0), 0);
        if (r < ROWS - 1) drawSeg(a, project(points[r + 1][c].x, points[r + 1][c].y, 0, 0, 0), 0);
      }
    }
  }

  window.addEventListener("resize", () => {
    resize();
    if (reduceMotion) staticFrame();
  });

  resize();
  if (reduceMotion) {
    staticFrame();
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>

</body>
